{% extends "base.html" %}
{% block title %}Login · Employee Management{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card">
    <div class="logo">👥</div>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to Employee Management</p>
    <form method="post">
      <label for="username">Username</label>
      <input id="username" name="username" placeholder="Enter username" required autofocus>
      <label for="pw">Password</label>
      <div class="pw-field">
        <input id="pw" name="password" type="password" placeholder="Enter password" required>
        <button type="button" id="pwBtn" class="pw-toggle" onclick="togglePw()">Show</button>
      </div>
      <button type="submit" class="submit">Sign in</button>
    </form>
    <div class="hint">Demo login: <b>admin</b> / <b>admin123</b></div>
  </div>
</div>
{% endblock %}
